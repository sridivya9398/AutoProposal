name: Daily Contribution Pulse

on:
  schedule:
    - cron: '0 15 * * *' # Runs at 15:00 UTC (approx. 8am-10am US time) every day
  workflow_dispatch: # Allows manual trigger

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily contribution script
        run: node scripts/daily_contribution.cjs

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add DAILY_LOG.md
          git commit -m "docs: daily pulse update 🚀" || echo "No changes to commit"
          git push
